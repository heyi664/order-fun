services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../src/main/resources/db/heyee-comments.sql:/docker-entrypoint-initdb.d/01-heyee-comments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  namesrv:
    image: apache/rocketmq:4.9.6
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx128m -Xmn64m
    volumes:
      - namesrv-data:/home/rocketmq/logs

  broker:
    image: apache/rocketmq:4.9.6
    restart: unless-stopped
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/rocketmq-4.9.6/conf/broker.conf
    depends_on:
      - namesrv
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m -XX:MaxMetaspaceSize=128m
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-4.9.6/conf/broker.conf:ro
      - broker-data:/home/rocketmq/store

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    restart: unless-stopped
    depends_on:
      - namesrv
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=namesrv:9876 -Xms128m -Xmx128m
    ports:
      - "127.0.0.1:8082:8080"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_started
    environment:
      JAVA_OPTS: ${APP_JAVA_OPTS}
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ROCKETMQ_NAME_SERVER: namesrv:9876
      ROCKETMQ_PRODUCER_GROUP: heyee-seckill-producer
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE}
      MAIL_FROM: ${MAIL_FROM}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL}
      AGENT_CONNECT_TIMEOUT: ${AGENT_CONNECT_TIMEOUT}
      AGENT_READ_TIMEOUT: ${AGENT_READ_TIMEOUT}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN}
      MCP_ALLOW_ANONYMOUS: ${MCP_ALLOW_ANONYMOUS}
      ADMIN_BOOTSTRAP_REGISTER_CODE: ${ADMIN_BOOTSTRAP_REGISTER_CODE}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/nginx-1.18.0/html/hmdp:/usr/share/nginx/html:ro

volumes:
  mysql-data:
  redis-data:
  namesrv-data:
  broker-data:
